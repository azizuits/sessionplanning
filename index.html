function showRegister(){
 gate(`<p class='mt'>প্রধান শিক্ষকের নিবন্ধন (একবারই করা যায়)</p><div style='display:flex;gap:10px;align-items:center'><img id='rph' class='av lg' alt=''><input type='file' accept='image/*' data-ph='rph' id='rphi'></div><input id='rnm' placeholder='নাম'><input id='rds' placeholder='পদবী' value='প্রধান শিক্ষক'><input id='rmb' placeholder='মোবাইল নম্বর' inputmode='tel'><input id='rem' type='email' placeholder='ই-মেইল' inputmode='email'><input id='rpw' type='password' placeholder='পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)' autocomplete='new-password'><div class='err' id='rer'></div><button class='p' id='rgo'>নিবন্ধন করুন</button><button class='lnk' id='rbk'>← লগইনে ফিরুন</button>`);
 document.getElementById('rbk').onclick=()=>showLogin();
 document.getElementById('rgo').onclick=async()=>{const v=i=>document.getElementById(i).value.trim(),er=document.getElementById('rer'),bt=document.getElementById('rgo'),em=v('rem').toLowerCase(),pw=document.getElementById('rpw').value;
  if(!v('rnm')||!em||!v('rmb')){er.textContent='নাম, মোবাইল ও ই-মেইল দিন';return}if(pw.length<8){er.textContent='পাসওয়ার্ড অন্তত ৮ অক্ষরের হতে হবে';return}
  bt.disabled=true;bt.textContent='অপেক্ষা করুন...';
  const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:v('rnm'),designation:v('rds'),mobile:v('rmb')}}});
  if(error||!data.user){er.textContent=error?error.message:'নিবন্ধন হয়নি';bt.disabled=false;bt.textContent='নিবন্ধন করুন';return}
  if(!data.session){showMsg('নিবন্ধন হয়েছে। ই-মেইলে পাঠানো লিংকে ক্লিক করে নিশ্চিত করুন, তারপর লগইন করুন। (Supabase-এ "Confirm email" বন্ধ রাখলে এই ধাপ লাগবে না)');return}
  const ph=document.getElementById('rphi').dataset.url;if(ph)await sb.from('profiles').update({photo:ph}).eq('id',data.user.id);
  start()}}
function showMsg(t){gate(`<p>${t}</p><button id='lout'>বের হোন</button>`);document.getElementById('lout').onclick=async()=>{await sb.auth.signOut();location.reload()}}
async function loadCtx(u){
 ME=u;PFX='u'+u.id.slice(0,8)+':';const ck='ctx:'+u.id;
 try{
  const [p,s,sj,as,pr]=await Promise.all([
   sb.from('profiles').select('*').eq('id',u.id).maybeSingle(),
   sb.from('school').select('*').maybeSingle(),
   sb.from('subjects').select('*').eq('active',true).order('class_name').order('code'),
   sb.from('assignments').select('*'),
   sb.from('profiles').select('id,email,full_name,designation,mobile,role,active,photo')]);
  if(p.error||sj.error)throw (p.error||sj.error);
  if(!p.data||p.data.active===false)return 'inactive';
  P=p.data;SCHOOL=s.data;SUBJ=sj.data||[];ASG=as.data||[];PROF=pr.data||[];
  LS.s(ck,{P,SCHOOL,SUBJ,ASG,PROF});LS.s('lastUser',{id:u.id,email:u.email});
 }catch(e){const c=LS.g(ck,null);if(!c)return 'offline';({P,SCHOOL,SUBJ,ASG,PROF}=c)}
 return 'ok'}
let started=false;
async function start(){
 let u=null;
 try{const {data}=await sb.auth.getSession();u=data&&data.session&&data.session.user}catch(e){}
 if(!u){const lu=LS.g('lastUser',null);if(lu&&!navigator.onLine)u={id:lu.id,email:lu.email}}
 if(!u){showLogin();return}
 const r=await loadCtx(u);
 if(r==='ok'){if(started)return;started=true;gEl().hidden=true;boot()}
 else if(r==='inactive')showMsg('আপনার অ্যাকাউন্ট এখনো সক্রিয় করা হয়নি বা তালিকাভুক্ত নয়। অ্যাডমিনের সাথে যোগাযোগ করুন।');
 else showMsg('ইন্টারনেট নেই এবং এই ডিভাইসে আগের তথ্য জমা নেই। ইন্টারনেট চালু করে আবার চেষ্টা করুন।')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
